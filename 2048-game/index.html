<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>2048 小游戏</title>
    <style>
        :root {
            --bg-color: #faf8ef;
            --game-bg: #bbada0;
            --cell-bg: #cdc1b4;
            --text-color: #776e65;
            --accent-color: #f67c5f;
            --header-bg: #f67c5f;
            --button-bg: #8f7a66;
            --button-hover: #9f8b77;
            --modal-bg: rgba(238, 228, 218, 0.73);
            --score-bg: #f67c5f;
            --score-add: #f67c5f;
        }

        [data-theme="dark"] {
            --bg-color: #1a1a2e;
            --game-bg: #16213e;
            --cell-bg: #0f3460;
            --text-color: #eaeaea;
            --accent-color: #e94560;
            --header-bg: #e94560;
            --button-bg: #533483;
            --button-hover: #6b4498;
            --modal-bg: rgba(22, 33, 62, 0.9);
            --score-bg: #e94560;
            --score-add: #e94560;
        }

        [data-theme="nature"] {
            --bg-color: #e8f5e9;
            --game-bg: #5d8a66;
            --cell-bg: #a5d6a7;
            --text-color: #1b5e20;
            --accent-color: #4caf50;
            --header-bg: #4caf50;
            --button-bg: #388e3c;
            --button-hover: #4caf50;
            --modal-bg: rgba(200, 230, 201, 0.85);
            --score-bg: #4caf50;
            --score-add: #4caf50;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: background-color 0.3s, color 0.3s;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 500px;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 4rem;
            color: var(--accent-color);
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 1rem;
            opacity: 0.7;
        }

        .score-board {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .score-box {
            background: var(--game-bg);
            color: #fff;
            padding: 10px 20px;
            border-radius: 8px;
            text-align: center;
            min-width: 100px;
            position: relative;
            overflow: visible;
        }

        .score-box .label {
            font-size: 0.75rem;
            text-transform: uppercase;
            opacity: 0.8;
        }

        .score-box .value {
            font-size: 1.5rem;
            font-weight: bold;
        }

        .score-add {
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            color: var(--score-add);
            font-weight: bold;
            font-size: 1.2rem;
            animation: scoreFloat 0.8s ease-out forwards;
            pointer-events: none;
        }

        @keyframes scoreFloat {
            0% { opacity: 1; transform: translateX(-50%) translateY(0); }
            100% { opacity: 0; transform: translateX(-50%) translateY(-40px); }
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .btn {
            background: var(--button-bg);
            color: #fff;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
            min-width: 100px;
        }

        .btn:hover:not(:disabled) {
            background: var(--button-hover);
            transform: scale(1.02);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-primary {
            background: var(--accent-color);
        }

        .btn-primary:hover:not(:disabled) {
            background: var(--accent-color);
            filter: brightness(1.1);
        }

        .settings {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            align-items: center;
        }

        .setting-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .setting-group label {
            font-size: 0.9rem;
        }

        .setting-group select {
            padding: 8px 12px;
            border: 2px solid var(--game-bg);
            border-radius: 6px;
            background: var(--bg-color);
            color: var(--text-color);
            font-size: 0.9rem;
            cursor: pointer;
        }

        .theme-switch {
            display: flex;
            gap: 8px;
        }

        .theme-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 3px solid transparent;
            cursor: pointer;
            transition: all 0.2s;
        }

        .theme-btn:hover {
            transform: scale(1.1);
        }

        .theme-btn.active {
            border-color: var(--text-color);
        }

        .theme-btn[data-theme="light"] {
            background: linear-gradient(135deg, #faf8ef 50%, #f67c5f 50%);
        }

        .theme-btn[data-theme="dark"] {
            background: linear-gradient(135deg, #1a1a2e 50%, #e94560 50%);
        }

        .theme-btn[data-theme="nature"] {
            background: linear-gradient(135deg, #e8f5e9 50%, #4caf50 50%);
        }

        .game-container {
            position: relative;
            margin: 0 auto;
        }

        .game-board {
            background: var(--game-bg);
            border-radius: 12px;
            padding: 12px;
            display: grid;
            gap: 12px;
            touch-action: none;
            position: relative;
        }

        .grid-cell {
            background: var(--cell-bg);
            border-radius: 8px;
            aspect-ratio: 1;
        }

        .tiles-container {
            position: absolute;
            top: 12px;
            left: 12px;
            right: 12px;
            bottom: 12px;
        }

        .tile {
            position: absolute;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            border-radius: 8px;
            transition: top 0.15s ease-in-out, left 0.15s ease-in-out;
            user-select: none;
        }

        .tile.tile-new {
            animation: tileAppear 0.2s ease-out;
        }

        .tile.tile-merged {
            animation: tileMerge 0.2s ease-out;
        }

        @keyframes tileAppear {
            0% { transform: scale(0); opacity: 0; }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes tileMerge {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        .tile-2 { background: #eee4da; color: #776e65; }
        .tile-4 { background: #ede0c8; color: #776e65; }
        .tile-8 { background: #f2b179; color: #f9f6f2; }
        .tile-16 { background: #f59563; color: #f9f6f2; }
        .tile-32 { background: #f67c5f; color: #f9f6f2; }
        .tile-64 { background: #f65e3b; color: #f9f6f2; }
        .tile-128 { background: #edcf72; color: #f9f6f2; font-size: 0.85em; }
        .tile-256 { background: #edcc61; color: #f9f6f2; font-size: 0.85em; }
        .tile-512 { background: #edc850; color: #f9f6f2; font-size: 0.85em; }
        .tile-1024 { background: #edc53f; color: #f9f6f2; font-size: 0.75em; }
        .tile-2048 { background: #edc22e; color: #f9f6f2; font-size: 0.75em; }
        .tile-super { background: #3c3a32; color: #f9f6f2; font-size: 0.65em; }

        [data-theme="dark"] .tile-2 { background: #4a4a6a; color: #eaeaea; }
        [data-theme="dark"] .tile-4 { background: #5a5a7a; color: #eaeaea; }
        [data-theme="dark"] .tile-8 { background: #6a6a9a; color: #eaeaea; }
        [data-theme="dark"] .tile-16 { background: #7a7aaa; color: #eaeaea; }
        [data-theme="dark"] .tile-32 { background: #e94560; color: #fff; }
        [data-theme="dark"] .tile-64 { background: #ff6b6b; color: #fff; }
        [data-theme="dark"] .tile-128 { background: #c44569; color: #fff; font-size: 0.85em; }
        [data-theme="dark"] .tile-256 { background: #e94560; color: #fff; font-size: 0.85em; }
        [data-theme="dark"] .tile-512 { background: #ff6b6b; color: #fff; font-size: 0.85em; }
        [data-theme="dark"] .tile-1024 { background: #f8b500; color: #1a1a2e; font-size: 0.75em; }
        [data-theme="dark"] .tile-2048 { background: #ff9f1a; color: #1a1a2e; font-size: 0.75em; }
        [data-theme="dark"] .tile-super { background: #ff9f1a; color: #1a1a2e; font-size: 0.65em; }

        [data-theme="nature"] .tile-2 { background: #c8e6c9; color: #1b5e20; }
        [data-theme="nature"] .tile-4 { background: #a5d6a7; color: #1b5e20; }
        [data-theme="nature"] .tile-8 { background: #81c784; color: #fff; }
        [data-theme="nature"] .tile-16 { background: #66bb6a; color: #fff; }
        [data-theme="nature"] .tile-32 { background: #4caf50; color: #fff; }
        [data-theme="nature"] .tile-64 { background: #43a047; color: #fff; }
        [data-theme="nature"] .tile-128 { background: #388e3c; color: #fff; font-size: 0.85em; }
        [data-theme="nature"] .tile-256 { background: #2e7d32; color: #fff; font-size: 0.85em; }
        [data-theme="nature"] .tile-512 { background: #1b5e20; color: #fff; font-size: 0.85em; }
        [data-theme="nature"] .tile-1024 { background: #004d40; color: #fff; font-size: 0.75em; }
        [data-theme="nature"] .tile-2048 { background: #00251a; color: #fff; font-size: 0.75em; }
        [data-theme="nature"] .tile-super { background: #00251a; color: #fff; font-size: 0.65em; }

        .game-over-overlay, .win-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--modal-bg);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s;
            z-index: 100;
        }

        .game-over-overlay.show, .win-overlay.show {
            opacity: 1;
            visibility: visible;
        }

        .overlay-title {
            font-size: 2.5rem;
            font-weight: bold;
            margin-bottom: 20px;
            color: var(--text-color);
        }

        .win-overlay .overlay-title {
            color: var(--accent-color);
        }

        .overlay-buttons {
            display: flex;
            gap: 10px;
        }

        .leaderboard {
            margin-top: 30px;
            background: var(--game-bg);
            border-radius: 12px;
            padding: 20px;
        }

        .leaderboard h3 {
            color: #fff;
            margin-bottom: 15px;
            text-align: center;
        }

        .leaderboard-list {
            list-style: none;
        }

        .leaderboard-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 15px;
            color: #fff;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .leaderboard-item:last-child {
            border-bottom: none;
        }

        .leaderboard-item .rank {
            font-weight: bold;
            color: var(--accent-color);
            min-width: 30px;
        }

        .leaderboard-item .score-value {
            font-weight: bold;
        }

        .leaderboard-item .empty {
            opacity: 0.5;
            font-style: italic;
        }

        .instructions {
            margin-top: 20px;
            text-align: center;
            font-size: 0.85rem;
            opacity: 0.7;
            line-height: 1.6;
        }

        .replay-btn {
            margin-top: 15px;
        }

        @media (max-width: 520px) {
            h1 { font-size: 3rem; }
            .container { padding: 15px; }
            .score-box { padding: 8px 15px; min-width: 80px; }
            .score-box .value { font-size: 1.2rem; }
            .btn { padding: 10px 18px; font-size: 0.9rem; }
            .settings { gap: 10px; }
            .game-board { padding: 8px; gap: 8px; }
            .tiles-container { top: 8px; left: 8px; right: 8px; bottom: 8px; }
        }

        .sound-toggle {
            position: fixed;
            top: 15px;
            right: 15px;
            background: var(--button-bg);
            border: none;
            color: #fff;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            z-index: 1000;
        }

        .sound-toggle:hover {
            transform: scale(1.1);
        }

        .hidden-controls {
            display: none;
        }

        @media (max-width: 768px) {
            .desktop-only {
                display: none;
            }
        }
    </style>
</head>
<body>
    <button class="sound-toggle" id="soundToggle" title="音效开关">🔊</button>

    <div class="container">
        <header>
            <h1>2048</h1>
            <p class="subtitle">合并相同数字，挑战2048！</p>
        </header>

        <div class="score-board">
            <div class="score-box">
                <div class="label">分数</div>
                <div class="value" id="score">0</div>
            </div>
            <div class="score-box">
                <div class="label">最高分</div>
                <div class="value" id="bestScore">0</div>
            </div>
        </div>

        <div class="controls">
            <button class="btn btn-primary" id="startBtn">开始游戏</button>
            <button class="btn" id="pauseBtn" disabled>暂停</button>
            <button class="btn" id="restartBtn" disabled>重新开始</button>
        </div>

        <div class="settings">
            <div class="setting-group">
                <label for="difficulty">难度：</label>
                <select id="difficulty">
                    <option value="4">4×4 简单</option>
                    <option value="5">5×5 普通</option>
                    <option value="6">6×6 困难</option>
                </select>
            </div>
            <div class="setting-group theme-switch">
                <button class="theme-btn active" data-theme="light" title="浅色主题"></button>
                <button class="theme-btn" data-theme="dark" title="深色主题"></button>
                <button class="theme-btn" data-theme="nature" title="自然主题"></button>
            </div>
        </div>

        <div class="game-container">
            <div class="game-board" id="gameBoard">
                <div class="tiles-container" id="tilesContainer"></div>
            </div>
            <div class="game-over-overlay" id="gameOverOverlay">
                <div class="overlay-title">游戏结束</div>
                <div class="overlay-buttons">
                    <button class="btn btn-primary" id="retryBtn">再来一局</button>
                    <button class="btn replay-btn" id="replayBtn">回放</button>
                </div>
            </div>
            <div class="win-overlay" id="winOverlay">
                <div class="overlay-title">🎉 恭喜通关！</div>
                <div class="overlay-buttons">
                    <button class="btn btn-primary" id="continueBtn">继续挑战</button>
                    <button class="btn" id="newGameBtn">新游戏</button>
                </div>
            </div>
        </div>

        <div class="leaderboard">
            <h3>🏆 本地排行榜</h3>
            <ul class="leaderboard-list" id="leaderboardList">
                <li class="leaderboard-item"><span class="rank">1.</span><span class="empty">暂无记录</span></li>
            </ul>
        </div>

        <div class="instructions">
            <p>🎮 操作方式：</p>
            <p class="desktop-only">键盘方向键 ↑ ↓ ← → 控制移动</p>
            <p class="mobile-only">滑动屏幕控制移动</p>
        </div>
    </div>

    <script>
        const Game = (() => {
            // ==================== 配置常量 ====================
            const STORAGE_KEYS = {
                BEST_SCORE: 'game2048_bestScore',
                LEADERBOARD: 'game2048_leaderboard',
                THEME: 'game2048_theme',
                SOUND: 'game2048_sound'
            };

            const WINNING_TILE = 2048;
            const MAX_LEADERBOARD = 10;

            // ==================== 私有状态 ====================
            let gridSize = 4;
            let grid = [];
            let score = 0;
            let bestScore = 0;
            let isRunning = false;
            let isPaused = false;
            let isGameOver = false;
            let hasWon = false;
            let continueAfterWin = false;
            let soundEnabled = true;
            let moveHistory = [];
            let audioContext = null;

            // ==================== DOM元素 ====================
            const elements = {
                gameBoard: document.getElementById('gameBoard'),
                tilesContainer: document.getElementById('tilesContainer'),
                scoreDisplay: document.getElementById('score'),
                bestScoreDisplay: document.getElementById('bestScore'),
                startBtn: document.getElementById('startBtn'),
                pauseBtn: document.getElementById('pauseBtn'),
                restartBtn: document.getElementById('restartBtn'),
                difficultySelect: document.getElementById('difficulty'),
                gameOverOverlay: document.getElementById('gameOverOverlay'),
                winOverlay: document.getElementById('winOverlay'),
                retryBtn: document.getElementById('retryBtn'),
                replayBtn: document.getElementById('replayBtn'),
                continueBtn: document.getElementById('continueBtn'),
                newGameBtn: document.getElementById('newGameBtn'),
                leaderboardList: document.getElementById('leaderboardList'),
                soundToggle: document.getElementById('soundToggle'),
                themeButtons: document.querySelectorAll('.theme-btn')
            };

            // ==================== 音效系统 ====================
            function initAudio() {
                if (!audioContext) {
                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                }
            }

            function playSound(type) {
                if (!soundEnabled) return;
                initAudio();

                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();

                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);

                switch(type) {
                    case 'move':
                        oscillator.frequency.value = 200;
                        oscillator.type = 'sine';
                        gainNode.gain.setValueAtTime(0.1, audioContext.currentTime);
                        gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.1);
                        oscillator.start();
                        oscillator.stop(audioContext.currentTime + 0.1);
                        break;
                    case 'merge':
                        oscillator.frequency.value = 400;
                        oscillator.type = 'sine';
                        gainNode.gain.setValueAtTime(0.15, audioContext.currentTime);
                        gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.15);
                        oscillator.start();
                        oscillator.stop(audioContext.currentTime + 0.15);
                        break;
                    case 'win':
                        playWinSound();
                        return;
                    case 'lose':
                        playLoseSound();
                        return;
                }
            }

            function playWinSound() {
                const notes = [523.25, 659.25, 783.99, 1046.50];
                notes.forEach((freq, i) => {
                    const osc = audioContext.createOscillator();
                    const gain = audioContext.createGain();
                    osc.connect(gain);
                    gain.connect(audioContext.destination);
                    osc.frequency.value = freq;
                    osc.type = 'sine';
                    gain.gain.setValueAtTime(0.15, audioContext.currentTime + i * 0.15);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + i * 0.15 + 0.3);
                    osc.start(audioContext.currentTime + i * 0.15);
                    osc.stop(audioContext.currentTime + i * 0.15 + 0.3);
                });
            }

            function playLoseSound() {
                const osc = audioContext.createOscillator();
                const gain = audioContext.createGain();
                osc.connect(gain);
                gain.connect(audioContext.destination);
                osc.frequency.value = 200;
                osc.type = 'sawtooth';
                gain.gain.setValueAtTime(0.1, audioContext.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.5);
                osc.start();
                osc.stop(audioContext.currentTime + 0.5);
            }

            // ==================== 存储管理 ====================
            function loadBestScore() {
                const stored = localStorage.getItem(STORAGE_KEYS.BEST_SCORE);
                bestScore = stored ? parseInt(stored) : 0;
                elements.bestScoreDisplay.textContent = bestScore;
            }

            function saveBestScore() {
                localStorage.setItem(STORAGE_KEYS.BEST_SCORE, bestScore.toString());
            }

            function loadTheme() {
                const stored = localStorage.getItem(STORAGE_KEYS.THEME);
                const theme = stored || 'light';
                applyTheme(theme);
            }

            function applyTheme(theme) {
                document.body.setAttribute('data-theme', theme === 'light' ? '' : theme);
                elements.themeButtons.forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.theme === theme);
                });
                localStorage.setItem(STORAGE_KEYS.THEME, theme);
            }

            function loadSoundSetting() {
                const stored = localStorage.getItem(STORAGE_KEYS.SOUND);
                soundEnabled = stored !== 'false';
                updateSoundButton();
            }

            function saveSoundSetting() {
                localStorage.setItem(STORAGE_KEYS.SOUND, soundEnabled.toString());
            }

            function updateSoundButton() {
                elements.soundToggle.textContent = soundEnabled ? '🔊' : '🔇';
            }

            function loadLeaderboard() {
                const stored = localStorage.getItem(STORAGE_KEYS.LEADERBOARD);
                return stored ? JSON.parse(stored) : [];
            }

            function saveLeaderboard(leaderboard) {
                localStorage.setItem(STORAGE_KEYS.LEADERBOARD, JSON.stringify(leaderboard));
            }

            function addToLeaderboard(newScore) {
                if (newScore === 0) return;
                let leaderboard = loadLeaderboard();
                leaderboard.push({
                    score: newScore,
                    date: new Date().toLocaleDateString(),
                    gridSize: gridSize
                });
                leaderboard.sort((a, b) => b.score - a.score);
                leaderboard = leaderboard.slice(0, MAX_LEADERBOARD);
                saveLeaderboard(leaderboard);
                renderLeaderboard();
            }

            function renderLeaderboard() {
                const leaderboard = loadLeaderboard();
                if (leaderboard.length === 0) {
                    elements.leaderboardList.innerHTML = `
                        <li class="leaderboard-item"><span class="rank">1.</span><span class="empty">暂无记录</span></li>
                    `;
                    return;
                }
                elements.leaderboardList.innerHTML = leaderboard.map((item, i) => `
                    <li class="leaderboard-item">
                        <span class="rank">${i + 1}.</span>
                        <span>${item.score}分</span>
                        <span class="empty">${item.gridSize}×${item.gridSize}</span>
                    </li>
                `).join('');
            }

            // ==================== 游戏逻辑 ====================
            function initGrid() {
                grid = Array(gridSize).fill(null).map(() => Array(gridSize).fill(0));
            }

            function getEmptyCells() {
                const empty = [];
                for (let r = 0; r < gridSize; r++) {
                    for (let c = 0; c < gridSize; c++) {
                        if (grid[r][c] === 0) empty.push({ r, c });
                    }
                }
                return empty;
            }

            function addRandomTile() {
                const empty = getEmptyCells();
                if (empty.length === 0) return null;
                const { r, c } = empty[Math.floor(Math.random() * empty.length)];
                const value = Math.random() < 0.9 ? 2 : 4;
                grid[r][c] = value;
                return { r, c, value, isNew: true };
            }

            function calculateTileSize() {
                const boardWidth = elements.gameBoard.offsetWidth - 24;
                return (boardWidth - (gridSize - 1) * (gridSize > 4 ? 8 : 12)) / gridSize;
            }

            function renderGrid() {
                elements.gameBoard.innerHTML = '';
                elements.gameBoard.style.gridTemplateColumns = `repeat(${gridSize}, 1fr)`;

                for (let i = 0; i < gridSize * gridSize; i++) {
                    const cell = document.createElement('div');
                    cell.className = 'grid-cell';
                    elements.gameBoard.appendChild(cell);
                }

                const tilesContainer = document.createElement('div');
                tilesContainer.className = 'tiles-container';
                tilesContainer.id = 'tilesContainer';
                elements.gameBoard.appendChild(tilesContainer);
            }

            function renderTiles(newTiles = [], mergedTiles = []) {
                const container = document.getElementById('tilesContainer');
                if (!container) return;
                container.innerHTML = '';

                const tileSize = calculateTileSize();
                const gap = gridSize > 4 ? 8 : 12;

                for (let r = 0; r < gridSize; r++) {
                    for (let c = 0; c < gridSize; c++) {
                        if (grid[r][c] !== 0) {
                            const tile = document.createElement('div');
                            const tileClass = grid[r][c] > 2048 ? 'tile-super' : `tile-${grid[r][c]}`;
                            tile.className = `tile ${tileClass}`;

                            const isNew = newTiles.some(t => t.r === r && t.c === c);
                            const isMerged = mergedTiles.some(t => t.r === r && t.c === c);

                            if (isNew) tile.classList.add('tile-new');
                            if (isMerged) tile.classList.add('tile-merged');

                            tile.style.width = `${tileSize}px`;
                            tile.style.height = `${tileSize}px`;
                            tile.style.left = `${c * (tileSize + gap)}px`;
                            tile.style.top = `${r * (tileSize + gap)}px`;
                            tile.style.fontSize = `${tileSize * 0.4}px`;

                            tile.textContent = grid[r][c];
                            container.appendChild(tile);
                        }
                    }
                }
            }

            function move(direction) {
                if (isPaused || isGameOver) return false;

                const oldGrid = grid.map(row => [...row]);
                let moved = false;
                let mergeScore = 0;
                const mergedTiles = [];

                const vectors = {
                    'up': { r: -1, c: 0 },
                    'down': { r: 1, c: 0 },
                    'left': { r: 0, c: -1 },
                    'right': { r: 0, c: 1 }
                };

                const v = vectors[direction];
                const traversals = getTraversals(direction);

                const merged = Array(gridSize).fill(null).map(() => Array(gridSize).fill(false));

                traversals.r.forEach(r => {
                    traversals.c.forEach(c => {
                        const value = grid[r][c];
                        if (value === 0) return;

                        let newR = r;
                        let newC = c;

                        while (true) {
                            const nextR = newR + v.r;
                            const nextC = newC + v.c;

                            if (nextR < 0 || nextR >= gridSize || nextC < 0 || nextC >= gridSize) break;

                            if (grid[nextR][nextC] === 0) {
                                newR = nextR;
                                newC = nextC;
                            } else if (grid[nextR][nextC] === value && !merged[nextR][nextC]) {
                                newR = nextR;
                                newC = nextC;
                                break;
                            } else {
                                break;
                            }
                        }

                        if (newR !== r || newC !== c) {
                            moved = true;
                            if (grid[newR][newC] === value) {
                                grid[newR][newC] = value * 2;
                                mergeScore += value * 2;
                                merged[newR][newC] = true;
                                mergedTiles.push({ r: newR, c: newC });

                                if (grid[newR][newC] === WINNING_TILE && !hasWon && !continueAfterWin) {
                                    hasWon = true;
                                }
                            } else {
                                grid[newR][newC] = value;
                            }
                            grid[r][c] = 0;
                        }
                    });
                });

                if (moved) {
                    score += mergeScore;
                    updateScore(mergeScore);

                    moveHistory.push({
                        direction,
                        gridBefore: oldGrid,
                        gridAfter: grid.map(row => [...row]),
                        score: score
                    });

                    const newTile = addRandomTile();
                    const newTiles = newTile ? [newTile] : [];

                    renderTiles(newTiles, mergedTiles);

                    if (hasWon && !continueAfterWin) {
                        setTimeout(() => showWinOverlay(), 300);
                    } else if (isGridFull() && !canMove()) {
                        setTimeout(() => gameOver(), 300);
                    }

                    playSound(mergeScore > 0 ? 'merge' : 'move');
                }

                return moved;
            }

            function getTraversals(direction) {
                const traversals = {
                    r: [...Array(gridSize).keys()],
                    c: [...Array(gridSize).keys()]
                };

                if (direction === 'down') traversals.r.reverse();
                if (direction === 'right') traversals.c.reverse();

                return traversals;
            }

            function isGridFull() {
                return getEmptyCells().length === 0;
            }

            function canMove() {
                for (let r = 0; r < gridSize; r++) {
                    for (let c = 0; c < gridSize; c++) {
                        if (grid[r][c] === 0) return true;
                        if (c < gridSize - 1 && grid[r][c] === grid[r][c + 1]) return true;
                        if (r < gridSize - 1 && grid[r][c] === grid[r + 1][c]) return true;
                    }
                }
                return false;
            }

            function updateScore(add) {
                elements.scoreDisplay.textContent = score;

                if (add > 0) {
                    showScoreAdd(add);
                }

                if (score > bestScore) {
                    bestScore = score;
                    elements.bestScoreDisplay.textContent = bestScore;
                    saveBestScore();
                }
            }

            function showScoreAdd(value) {
                const scoreBox = elements.scoreDisplay.parentElement;
                const addEl = document.createElement('div');
                addEl.className = 'score-add';
                addEl.textContent = `+${value}`;
                scoreBox.appendChild(addEl);
                setTimeout(() => addEl.remove(), 800);
            }

            function showGameOver() {
                isGameOver = true;
                isRunning = false;
                playSound('lose');
                addToLeaderboard(score);
                updateButtonStates();
                elements.gameOverOverlay.classList.add('show');
            }

            function showWinOverlay() {
                isRunning = false;
                isPaused = true;
                playSound('win');
                addToLeaderboard(score);
                updateButtonStates();
                elements.winOverlay.classList.add('show');
            }

            function hideOverlays() {
                elements.gameOverOverlay.classList.remove('show');
                elements.winOverlay.classList.remove('show');
            }

            // ==================== 游戏控制 ====================
            function startGame() {
                gridSize = parseInt(elements.difficultySelect.value);
                initGrid();
                score = 0;
                isGameOver = false;
                hasWon = false;
                continueAfterWin = false;
                isPaused = false;
                isRunning = true;
                moveHistory = [];

                elements.scoreDisplay.textContent = '0';

                renderGrid();

                addRandomTile();
                addRandomTile();

                renderTiles([{ r: 0, c: 0 }, { r: 0, c: 0 }]);

                hideOverlays();
                updateButtonStates();
            }

            function pauseGame() {
                if (!isRunning) return;
                isPaused = !isPaused;
                elements.pauseBtn.textContent = isPaused ? '继续' : '暂停';
            }

            function restartGame() {
                startGame();
            }

            function continueGame() {
                continueAfterWin = true;
                isPaused = false;
                isRunning = true;
                hideOverlays();
                elements.pauseBtn.textContent = '暂停';
            }

            function updateButtonStates() {
                elements.startBtn.disabled = isRunning;
                elements.pauseBtn.disabled = !isRunning;
                elements.restartBtn.disabled = !isRunning;
                elements.difficultySelect.disabled = isRunning;
            }

            // ==================== 回放系统 ====================
            let isReplaying = false;

            function replay() {
                if (moveHistory.length === 0) return;

                isReplaying = true;
                hideOverlays();

                initGrid();
                score = 0;
                elements.scoreDisplay.textContent = '0';
                renderGrid();

                let moveIndex = 0;

                function playNextMove() {
                    if (moveIndex >= moveHistory.length) {
                        isReplaying = false;
                        isGameOver = true;
                        showGameOver();
                        return;
                    }

                    const move = moveHistory[moveIndex];
                    grid = move.gridAfter.map(row => [...row]);
                    score = move.score;
                    elements.scoreDisplay.textContent = score;

                    renderTiles();

                    moveIndex++;
                    setTimeout(playNextMove, 300);
                }

                playNextMove();
            }

            // ==================== 事件处理 ====================
            function setupEventListeners() {
                elements.startBtn.addEventListener('click', startGame);
                elements.pauseBtn.addEventListener('click', pauseGame);
                elements.restartBtn.addEventListener('click', restartGame);
                elements.retryBtn.addEventListener('click', restartGame);
                elements.replayBtn.addEventListener('click', replay);
                elements.continueBtn.addEventListener('click', continueGame);
                elements.newGameBtn.addEventListener('click', startGame);

                elements.difficultySelect.addEventListener('change', () => {
                    if (!isRunning) {
                        gridSize = parseInt(elements.difficultySelect.value);
                        initGrid();
                        renderGrid();
                        addRandomTile();
                        addRandomTile();
                        renderTiles();
                    }
                });

                elements.themeButtons.forEach(btn => {
                    btn.addEventListener('click', () => applyTheme(btn.dataset.theme));
                });

                elements.soundToggle.addEventListener('click', () => {
                    soundEnabled = !soundEnabled;
                    updateSoundButton();
                    saveSoundSetting();
                });

                document.addEventListener('keydown', handleKeydown);

                setupTouchControls();
            }

            function handleKeydown(e) {
                if (isReplaying) return;

                const keyMap = {
                    'ArrowUp': 'up',
                    'ArrowDown': 'down',
                    'ArrowLeft': 'left',
                    'ArrowRight': 'right',
                    'w': 'up',
                    's': 'down',
                    'a': 'left',
                    'd': 'right'
                };

                const direction = keyMap[e.key];
                if (direction) {
                    e.preventDefault();
                    move(direction);
                }
            }

            function setupTouchControls() {
                let touchStartX = 0;
                let touchStartY = 0;
                let touchEndX = 0;
                let touchEndY = 0;

                elements.gameBoard.addEventListener('touchstart', (e) => {
                    touchStartX = e.touches[0].clientX;
                    touchStartY = e.touches[0].clientY;
                }, { passive: true });

                elements.gameBoard.addEventListener('touchmove', (e) => {
                    e.preventDefault();
                }, { passive: false });

                elements.gameBoard.addEventListener('touchend', (e) => {
                    touchEndX = e.changedTouches[0].clientX;
                    touchEndY = e.changedTouches[0].clientY;
                    handleSwipe();
                }, { passive: true });

                function handleSwipe() {
                    const dx = touchEndX - touchStartX;
                    const dy = touchEndY - touchStartY;
                    const minSwipe = 30;

                    if (Math.abs(dx) < minSwipe && Math.abs(dy) < minSwipe) return;

                    if (Math.abs(dx) > Math.abs(dy)) {
                        move(dx > 0 ? 'right' : 'left');
                    } else {
                        move(dy > 0 ? 'down' : 'up');
                    }
                }
            }

            // ==================== 初始化 ====================
            function init() {
                loadBestScore();
                loadTheme();
                loadSoundSetting();
                renderLeaderboard();
                initGrid();
                renderGrid();
                updateButtonStates();

                setupEventListeners();
            }

            return { init };
        })();

        document.addEventListener('DOMContentLoaded', Game.init);
    </script>
</body>
